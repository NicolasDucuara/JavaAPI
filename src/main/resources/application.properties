spring.application.name=colorapijava
# Puerto HTTP estándar (en producción Caddy manejará HTTPS y redirigirá hacia aquí)
server.port=${PORT:8080}

# --- Configuración de Base de Datos PostgreSQL (parametrizada con valores por defecto locales) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/colordb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Configuración JPA / Hibernate ---
# 'update': Hibernate crea o actualiza las tablas automáticamente según nuestras clases @Entity
spring.jpa.hibernate.ddl-auto=update
# Muestra las sentencias SQL en la consola para aprender y depurar qué hace Hibernate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Buena práctica: evitar mantener conexiones abiertas durante el renderizado de vistas
spring.jpa.open-in-view=false
