name: CI/CD Pipeline - Build, Test & Deploy

on:
  push:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ----------------------------------------------------------------------------
  # 1. Job de Test y Verificación con Maven
  # ----------------------------------------------------------------------------
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Iniciar PostgreSQL temporal para tests
        run: |
          docker run -d --name test-postgres \
            -e POSTGRES_DB=colordb \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=123 \
            -p 5433:5432 \
            postgres:16-alpine
          sleep 4

      - name: Ejecutar Tests Unitarios e Integración
        run: ./mvnw clean test

  # ----------------------------------------------------------------------------
  # 2. Job de Construcción de Imagen Docker y Publicación en GHCR
  # ----------------------------------------------------------------------------
  build-and-push:
    name: Build & Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convertir nombre del repo a minúsculas para Docker
        id: image_tag
        run: |
          echo "tag=${{ env.REGISTRY }}/$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]'):latest" >> "$GITHUB_OUTPUT"

      - name: Construir y publicar imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.image_tag.outputs.tag }}

  # ----------------------------------------------------------------------------
  # 3. Job de Despliegue en Servidor Proxmox (vía GitHub Self-Hosted Runner)
  # Funciona detrás de VPN, NAT o firewalls sin exponer puertos SSH a internet
  # ----------------------------------------------------------------------------
  deploy:
    name: Deploy to Proxmox Server
    needs: build-and-push
    runs-on: self-hosted

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Iniciar sesión en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Desplegar nueva versión con Docker Compose
        run: |
          # 1. Asegurar directorio de la aplicación
          mkdir -p /opt/colorapp
          cp docker-compose.yml /opt/colorapp/docker-compose.yml
          cd /opt/colorapp

          # 2. Descargar la imagen más reciente compilada en el paso anterior
          docker compose pull

          # 3. Reiniciar los contenedores con la nueva versión
          docker compose up -d --remove-orphans

          # 4. Limpiar imágenes antiguas sin uso para cuidar los 8GB de disco
          docker image prune -af
